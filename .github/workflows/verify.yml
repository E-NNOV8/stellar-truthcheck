name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and reproduce flagship
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.26.10
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false

      - name: Download and verify pinned modules
        run: |
          go mod download
          go mod verify

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l main.go main_test.go)"
          if [ -n "$unformatted" ]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with vet enabled
        run: go test -count=1 ./...

      - name: Build CLI
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -o dist/truthcheck .

      - name: Verify immutable flagship evidence
        run: sha256sum -c docs/evidence/SHA256SUMS

      - name: Assert real FAIL, PASS, and UNKNOWN behavior
        run: python3 scripts/verify_flagship.py ./dist/truthcheck
